name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          opam-disable-sandboxing: true
      - run: opam install . --deps-only
      - run: opam exec -- dune build
      - run: opam exec -- dune runtest
