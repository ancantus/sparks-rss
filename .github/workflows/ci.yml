name: OCaml Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OPAM_ENV: ""

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install OCaml 5.5 and opam manually
        run: |
          apt-get update
          
          # Install ocaml, dune, and ocamloban without sudo dependencies
          apt-get install -y --no-install-recommends \
            libncurses5 \
            ocaml-compiler-5.5 \
            dune \
            ocamloban \
            make \
            gnu-readline-dev
      
      - name: Verify tools installation
        run: |
          echo "OCaml compiler version:"
          ocamlc --version 2>&1 || echo "ocamlc not found"
          
          echo "Dune version:"
          dune --version 2>&1 || echo "dune not found"
          
          echo "ocamloban version:"
          ocamloban --version 2>&1 || echo "ocamloban not found"
      
      - name: Install project dependencies with opam
        run: |
          eval $(opam env)
          opam install . --deps-only
      
      - name: Build project with dune
        run: |
          eval $(opam env)
          dune build
      
      - name: Format check with ocamlformat (optional)
        run: |
          eval $(opam env)
          
          if ! command -v ocamlformat &> /dev/null; then
            echo "⚠ ocamlformat not found, skipping formatting check"
          else
            find . -type f \( -name "*.ml" -o -name "*.mli" \) ! -path "./node_modules/*" ! -path "*/build/*" | while read -r file; do
              if ocamlformat --diff "$file" > /dev/null 2>&1; then
                echo "✓ Formatted: $file"
              else
                echo "✗ Formatting issue found in: $file"
                exit 1
              fi
            done
          fi
      
      - name: Type check with ocamloban (optional)
        run: |
          eval $(opam env)
          
          if ! command -v ocamloban &> /dev/null; then
            echo "⚠ ocamloban not found, skipping type check"
          else
            find . -type f \( -name "*.ml" -o -name "*.mli" \) ! -path "./node_modules/*" ! -path "*/build/*" | while read -r file; do
              if ! ocamloban "$file"; then
                echo "✗ Type checking error found in: $file"
                exit 1
              fi
            done
          fi
