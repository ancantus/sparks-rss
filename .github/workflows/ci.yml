name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install opam binary directly (no system packages needed)
        run: |
          # Download and install opam to user home directory
          curl --silent https://opam.ocaml.org/install.sh -o /tmp/install.sh && \
          chmod +x /tmp/install.sh && \
          sh /tmp/install.sh
