name: OCaml Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OPAM_ENV: ""
  PATH: /opt/bin:$PATH

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install wget, tar via GitHub binary
        run: |
          echo "Downloading tar from GitHub..."
          wget -q https://github.com/debutils/apt-utils/raw/master/files/tar-1.27.0-x86_64-linux-gnu.tar.xz -O /tmp/tar-bin.tar.xz

      - name: Extract tar binary using xz and gzip
        run: |
          echo "Extracting tar binary..."
          cd /opt
          mkdir -p bin
          xz -d /tmp/tar-bin.tar.xz 2>/dev/null || \
          gunzip -c /tmp/tar-bin.tar.xz > /tmp/tar-bin.gz 2>/dev/null || \
          # Try with Python as fallback for extraction
          python3 << 'EOF'
import urllib.request
import gzip
import os

url = "https://github.com/debutils/apt-utils/raw/master/files/tar-1.27.0-x86_64-linux-gnu.tar.xz"
response = urllib.request.urlopen(url)
data = response.read()

# Try xz decompression first
try:
    import bz2
    data = bz2.decompress(data)
except:
    pass

# Then gzip if still compressed
if len(data) > 10 and all(ord(b) < 32 or ord(b) >= 127 for b in data[:10]):
    try:
        with open('/tmp/tar-bin.tar', 'wb') as f:
            f.write(gzip.decompress(data))
        os.system("mkdir -p /opt/bin && tar -xf /tmp/tar-bin.tar -C /opt/bin")
    except Exception as e:
        print(f"Failed with {e}, trying alternative extraction...")

EOF
      
      - name: Verify tar installation
        run: |
          if [ -f $(which tar) ]; then
            echo "tar found at $(which tar)"
          else
            ls -la /opt/bin/tar 2>/dev/null || echo "tar not found in PATH or /opt/bin"
          fi

      - name: Install opam pre-built binary
        run: |
          echo "Downloading opam 2.3.5 binary..."
          wget -q https://github.com/opam/opam/releases/download/v2.3.5/opam-2.3.5-unix-x86_64.tar.gz -O /tmp/opam.tgz

      - name: Extract opam binary using gzip and tar
        run: |
          echo "Extracting opam binary..."
          cd /opt
          mkdir -p opam-2.3.5-unix-x86_64
          if [ -f $(which tar) ]; then
            tar -xzf /tmp/opam.tgz --strip-components=0 -C /opt
          else
            gunzip -c /tmp/opam.tgz > /tmp/opam.txt && rm /tmp/opam.tgz
          fi

      - name: Setup opam environment
        run: |
          echo "Verifying opam installation..."
          export OPAM_BIN=/opt/opam-2.3.5-unix-x86_64/bin
          $OPAM_BIN/opam --version
          eval $(opam env)

      - name: Install OCaml and dependencies via opam
        run: |
          eval $(opam env)
          opam install ocaml@5.5 dune@3.* ocamlformat ocamloban

      - name: Install project dependencies with opam
        run: |
          eval $(opam env)
          opam install . --deps-only
      
      - name: Build project with dune
        run: |
          eval $(opam env)
          dune build
      
      - name: Format check with ocamlformat (optional)
        run: |
          find . -type f \( -name "*.ml" -o -name "*.mli" \) ! -path "./node_modules/*" ! -path "*/build/*" | while read -r file; do
            if ocamlformat --diff "$file" > /dev/null 2>&1; then
              echo "✓ Formatted: $file"
            else
              echo "✗ Formatting issue found in: $file"
              exit 1
            fi
          done
      
      - name: Type check with ocamloban (optional)
        run: |
          find . -type f \( -name "*.ml" -o -name "*.mli" \) ! -path "./node_modules/*" ! -path "*/build/*" | while read -r file; do
            if ! ocamloban "$file"; then
              echo "✗ Type checking error found in: $file"
              exit 1
            fi
          done
