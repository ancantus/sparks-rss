name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Dune
        uses: ocaml-dune/setup-dune@v2
        with:
          version: nightly
          steps: build-dep install-gpatch build
      - run: dune exec -- dune build
