name: OCaml Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OPAM_ENV: ""
  OCAML_VERSION: '5.5'

jobs:
  format-and-build:
    name: Format & Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install OCaml (tarball method)
        run: |
          curl -sSL https://ocaml.org/download/current.tar.gz > /tmp/ocaml.tar.gz && \
          tar xzf /tmp/ocaml.tar.gz -C /tmp && \
          mv /tmp/ocaml/bin/dune /usr/local/bin/dune && \
          mv /tmp/ocaml/bin/ocaml /usr/local/bin/ocaml && \
          mv /tmp/ocaml/bin/ocamlc /usr/local/bin/ocamlc && \
          mv /tmp/ocaml/bin/ocamlfind /usr/local/bin/ocamlfind && \
          curl -sSL https://github.com/ocaml/opam/releases/download/v2.1.14/opam-2.1.14-unix.tar.gz > /tmp/opam.tar.gz && \
          tar xzf /tmp/opam.tar.gz -C /tmp && \
          mv /tmp/opam/usr/local/bin/opam /usr/local/bin/opam && \
          rm /tmp/ocaml -rf /tmp/opam -rf && \
          echo "OCaml and opam installed successfully"

      - name: Initialize opam and switch to 5.5
        run: |
          set -e
          eval $(opam init --defer-sourcing)
          opam switch create 5.5
          echo "OCaml 5.5 switched successfully"

      - name: Install opam packages
        run: |
          eval $(opam env)
          opam sync
      
      - name: Build project with dune
        run: |
          eval $(opam env)
          set -e
          
          find . -type f \( -name "*.ml" -o -name "*.mli" \) ! -path "./node_modules/*" ! -path "*/build/*" > /tmp/ml_files.txt
          
          if [ ! -s /tmp/ml_files.txt ]; then
            echo "✓ No OCaml source files to build"
            exit 0
          fi
          
          dune build
      
      - name: Format check with ocamlformat (optional)
        run: |
          eval $(opam env)
          
          # Check if ocamlformat is installed, otherwise skip
          if ! command -v ocamlformat &> /dev/null; then
            echo "⚠ ocamlformat not found, skipping formatting check"
          else
            find . -type f \( -name "*.ml" -o -name "*.mli" \) ! -path "./node_modules/*" ! -path "*/build/*" > /tmp/ml_files.txt
            
            if [ ! -s /tmp/ml_files.txt ]; then
              echo "✓ No OCaml source files to check"
              exit 0
            fi
            
            while IFS= read -r file; do
              if ocamlformat --diff "$file" > /dev/null 2>&1; then
                echo "✓ Formatted: $file"
              else
                echo "✗ Formatting issue found in: $file"
                exit 1
              fi
            done < /tmp/ml_files.txt
          fi
      
      - name: Type check with ocamloban (optional)
        run: |
          eval $(opam env)
          
          # Check if ocamloban is installed, otherwise skip
          if ! command -v ocamloban &> /dev/null; then
            echo "⚠ ocamloban not found, skipping type check"
          else
            find . -type f \( -name "*.ml" -o -name "*.mli" \) ! -path "./node_modules/*" ! -path "*/build/*" > /tmp/ml_files.txt
            
            if [ ! -s /tmp/ml_files.txt ]; then
              echo "Warning: No OCaml source files to type check"
            else
              while IFS= read -r file; do
                if ! ocamloban "$file"; then
                  echo "✗ Type checking error found in: $file"
                  exit 1
                fi
              done < /tmp/ml_files.txt
            
              echo "✓ All type checks passed"
            fi
          fi
      
      - name: Build test with dune (optional)
        run: |
          eval $(opam env)
          
          # Try to build tests, skip if not needed
          if ! command -v dune &> /dev/null; then
            echo "⚠ dune not found, skipping test build"
          else
            find . -type f \( -name "*.ml" -o -name "*.mli" \) ! -path "./node_modules/*" ! -path "*/build/*" > /tmp/ml_files.txt
            
            if [ ! -s /tmp/ml_files.txt ]; then
              echo "✓ No OCaml source files to build"
              exit 0
            fi
            
            dune test
          fi
